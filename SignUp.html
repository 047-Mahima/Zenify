<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — Zenify</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Lato", sans-serif; background-color: #fffaf4; }
      .oauth-btn { border: 1px solid #dee2e6; background: #fff; }
      .oauth-btn:hover { background-color: #f8f9fa; }
      .oauth-btn img { width: 20px; height: 20px; object-fit: contain; }
    </style>
  </head>
  <body>
    <section class="wrapper py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-sm-10 col-md-8 col-lg-6 text-center">
            <form class="rounded shadow p-5" style="background-color: #EBD4DD;" novalidate>
              <div class="logo mb-3">
                <img src="./Zenify/zenify.png" class="img-fluid rounded-circle" alt="Zenify logo" style="max-width: 50%;" />
              </div>
              <h3 class="text-dark fw-bolder fs-4 mb-2">Create an Account</h3>
              <div class="fw-normal text-muted mb-3">
                Already have an account? <a href="Login.html" class="text-decoration-none fw-bold" style="color: #d28383">Sign in here</a>
              </div>
              <!-- OAuth — UI placeholder; backend integration required -->
              <button type="button" class="btn oauth-btn w-100 mb-4" disabled title="Google sign-in coming soon">
                <img src="./Zenify/google.svg" alt="" class="me-2" />Sign up with Google
              </button>
              <div class="text-center text-muted text-uppercase mb-3">or</div>
              <div class="row g-3 text-start">
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="firstName" placeholder="First Name" required />
                    <label for="firstName">First Name</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="lastName" placeholder="Last Name" required />
                    <label for="lastName">Last Name</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="email" class="form-control" id="signupEmail" placeholder="Email address" required />
                    <label for="signupEmail">Email address</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="tel" class="form-control" id="contactNumber" placeholder="Contact Number" />
                    <label for="contactNumber">Contact Number</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="password" class="form-control" id="signupPassword" placeholder="Password" required />
                    <label for="signupPassword">Password</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required />
                    <label for="confirmPassword">Confirm Password</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="number" class="form-control" id="age" placeholder="Age" min="5" max="120" />
                    <label for="age">Age</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <select class="form-select" id="gender" aria-label="Gender">
                      <option value="" selected>Select Gender</option>
                      <option value="male">Male</option>
                      <option value="female">Female</option>
                      <option value="other">Other</option>
                      <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                    <label for="gender">Gender</label>
                  </div>
                </div>
              </div>
              <div class="form-check d-flex align-items-center mt-3 text-start">
                <input class="form-check-input" type="checkbox" id="termsCheck" required />
                <label class="form-check-label ms-2" for="termsCheck">
                  I agree to the <a href="#" style="color: #d28383">Terms and Conditions</a>.
                </label>
              </div>
              <button type="submit" class="btn w-100 my-4" style="background-color: #d28383; color: #fff;">
                Continue
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Zenify</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital@0;1&display=swap" rel="stylesheet" />
    <style>
      body { font-family: "Lato", sans-serif; background-color: #fffaf4; }
      .oauth-btn { border: 1px solid #dee2e6; background: #fff; }
      .oauth-btn:hover { background-color: #f8f9fa; }
      .oauth-btn img { width: 20px; height: 20px; object-fit: contain; }
    </style>
  </head>
  <body>
    <section class="wrapper py-5">
      <div class="container">
        <div class="col-sm-8 offset-sm-2 col-lg-6 offset-lg-3 col-xl-4 offset-xl-4 text-center">
          <form class="rounded shadow p-5" style="background-color: #ebd4dd" novalidate>
            <img
              src="./Zenify/zenify.png"
              class="img-fluid rounded-circle mb-4"
              alt="Zenify logo"
              style="max-width: 80%"
            />
            <h3 class="text-dark fw-bolder fs-4 mb-2">Sign In to Zenify</h3>
            <div class="fw-normal text-muted mb-4">
              New here?
              <a href="SignUp.html" class="text-decoration-none fw-bold" style="color: #d28383">Create an account</a>
            </div>
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required />
              <label for="loginEmail">Email address</label>
            </div>
            <div class="form-floating">
              <input type="password" class="form-control" id="loginPassword" placeholder="Password" required />
              <label for="loginPassword">Password</label>
            </div>
            <div class="mt-2 text-end">
              <a href="#" class="text-decoration-none fw-bold" style="color: #d28383">Forgot password?</a>
            </div>
            <button type="submit" class="btn w-100 my-4" style="background-color: #d28383; color: #fff;">
              Continue
            </button>
            <div class="text-center text-muted text-uppercase mb-3">or</div>
            <!-- OAuth buttons are UI placeholders — backend integration required -->
            <button type="button" class="btn oauth-btn w-100 mb-3" disabled title="Google sign-in coming soon">
              <img src="./Zenify/google.svg" alt="" class="me-2" />
              Continue with Google
            </button>
            <button type="button" class="btn oauth-btn w-100 mb-3" disabled title="Facebook sign-in coming soon">
              <img src="./Zenify/facebook.svg" alt="" class="me-2" />
              Continue with Facebook
            </button>
            <button type="button" class="btn oauth-btn w-100 mb-3" disabled title="LinkedIn sign-in coming soon">
              <img src="./Zenify/linkedin.svg" alt="" class="me-2" />
              Continue with LinkedIn
            </button>
          </form>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

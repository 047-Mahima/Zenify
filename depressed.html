<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depressed — Zenify Journal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="journal.css" />
  </head>
  <body data-mood="depressed">
    <div class="container mt-4">
      <p class="page-subtitle">Navigating through difficult times? We are here.</p>
      <div class="card journal-card">
        <div class="card-header">
          <h6 class="mb-0">You're not alone. Expressing yourself can be the first step towards hope.</h6>
        </div>
        <div class="card-body">
          <form id="journalForm" novalidate>
            <div class="mb-3">
              <label for="depressedFeeling" class="form-label">1. Are you experiencing a sense of depression today?</label>
              <input type="text" class="form-control" id="depressedFeeling" name="depressedFeeling" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="depressedTriggers" class="form-label">2. Can you pinpoint any specific triggers or patterns in your feelings of depression?</label>
              <input type="text" class="form-control" id="depressedTriggers" name="depressedTriggers" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="depressedManage" class="form-label">3. How do you manage and navigate your depressive episodes?</label>
              <input type="text" class="form-control" id="depressedManage" name="depressedManage" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="depressedCoping" class="form-label">4. What self-care practices or coping mechanisms do you find most effective in combating depression and fostering mental well-being?</label>
              <input type="text" class="form-control" id="depressedCoping" name="depressedCoping" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <button type="submit" class="btn-journal">Save Entry</button>
          </form>
        </div>
      </div>
      <a href="index.html" class="back-link">&#8592; Back to home</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="journal.js"></script>
  </body>
</html>

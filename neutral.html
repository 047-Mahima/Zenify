<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neutral — Zenify Journal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="journal.css" />
  </head>
  <body data-mood="neutral">
    <div class="container mt-4">
      <p class="page-subtitle">Life's good!</p>
      <div class="card journal-card">
        <div class="card-header">
          <h6 class="mb-0">Explore your emotions and find your balance</h6>
        </div>
        <div class="card-body">
          <form id="journalForm" novalidate>
            <div class="mb-3">
              <label for="neutralMood" class="form-label">1. How would you describe your mood today?</label>
              <input type="text" class="form-control" id="neutralMood" name="neutralMood" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="neutralReason" class="form-label">2. Is there a specific reason or event that has left you feeling neutral?</label>
              <input type="text" class="form-control" id="neutralReason" name="neutralReason" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="neutralExpression" class="form-label">3. Do you find it challenging to express your emotions when you're feeling neutral?</label>
              <input type="text" class="form-control" id="neutralExpression" name="neutralExpression" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="neutralActivities" class="form-label">4. Are there any activities or hobbies that help you find balance when you're in a neutral state?</label>
              <input type="text" class="form-control" id="neutralActivities" name="neutralActivities" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <button type="submit" class="btn-journal">Save Entry</button>
          </form>
        </div>
      </div>
      <a href="index.html" class="back-link">&#8592; Back to home</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="journal.js"></script>
  </body>
</html>

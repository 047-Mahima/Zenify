<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy — Zenify Journal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="journal.css" />
  </head>
  <body data-mood="happy">
    <div class="container mt-4">
      <p class="page-subtitle">Radiating with happiness today!</p>
      <div class="card journal-card">
        <div class="card-header">
          <h6 class="mb-0">Share your joy and let it brighten our day</h6>
        </div>
        <div class="card-body">
          <form id="journalForm" novalidate>
            <div class="mb-3">
              <label for="happyCause" class="form-label">1. What is bringing happiness to your life today?</label>
              <input type="text" class="form-control" id="happyCause" name="happyCause" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="happyExpression" class="form-label">2. How do you usually express your happiness when you're feeling joyful?</label>
              <input type="text" class="form-control" id="happyExpression" name="happyExpression" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="happyContributors" class="form-label">3. Who or what contributes most to your happiness?</label>
              <input type="text" class="form-control" id="happyContributors" name="happyContributors" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="happySustain" class="form-label">4. What can you do to sustain this happiness and spread positivity to others?</label>
              <input type="text" class="form-control" id="happySustain" name="happySustain" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <button type="submit" class="btn-journal">Save Entry</button>
          </form>
        </div>
      </div>
      <a href="index.html" class="back-link">&#8592; Back to home</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="journal.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excited — Zenify Journal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="journal.css" />
  </head>
  <body data-mood="excited">
    <div class="container mt-4">
      <p class="page-subtitle">Overflowing with excitement and positive energy today!</p>
      <div class="card journal-card">
        <div class="card-header">
          <h6 class="mb-0">It's an exciting day filled with possibilities!</h6>
        </div>
        <div class="card-body">
          <form id="journalForm" novalidate>
            <div class="mb-3">
              <label for="excitedSource" class="form-label">1. What's sparking your excitement today?</label>
              <input type="text" class="form-control" id="excitedSource" name="excitedSource" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="excitedDetails" class="form-label">2. Can you describe the source of your excitement in more detail?</label>
              <input type="text" class="form-control" id="excitedDetails" name="excitedDetails" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="excitedExpression" class="form-label">3. How do you express your enthusiasm when you're feeling excited?</label>
              <input type="text" class="form-control" id="excitedExpression" name="excitedExpression" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="excitedContributors" class="form-label">4. Who or what contributes most to your excitement and happiness?</label>
              <input type="text" class="form-control" id="excitedContributors" name="excitedContributors" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <button type="submit" class="btn-journal">Save Entry</button>
          </form>
        </div>
      </div>
      <a href="index.html" class="back-link">&#8592; Back to home</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="journal.js"></script>
  </body>
</html>

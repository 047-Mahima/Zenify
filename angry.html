<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angry — Zenify Journal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="journal.css" />
  </head>
  <body data-mood="angry">
    <div class="container mt-4">
      <p class="page-subtitle">We agree, life is not fair sometimes :/</p>
      <div class="card journal-card">
        <div class="card-header">
          <h6 class="mb-0">Take a deep breath &amp; pour your heart out</h6>
        </div>
        <div class="card-body">
          <form id="journalForm" novalidate>
            <div class="mb-3">
              <label for="angryTrigger" class="form-label">1. What made you feel angry today?</label>
              <input type="text" class="form-control" id="angryTrigger" name="angryTrigger" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="angrySituation" class="form-label">2. Can you describe the situation that triggered your anger?</label>
              <input type="text" class="form-control" id="angrySituation" name="angrySituation" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="angryExpression" class="form-label">3. Did you express your anger or keep it to yourself?</label>
              <input type="text" class="form-control" id="angryExpression" name="angryExpression" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <div class="mb-3">
              <label for="angryFutureHandling" class="form-label">4. How would you like to handle similar situations in the future?</label>
              <input type="text" class="form-control" id="angryFutureHandling" name="angryFutureHandling" required />
              <div class="invalid-feedback">Please fill in this field.</div>
            </div>
            <button type="submit" class="btn-journal">Save Entry</button>
          </form>
        </div>
      </div>
      <a href="index.html" class="back-link">&#8592; Back to home</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="journal.js"></script>
  </body>
</html>
